<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B – Notaría Oscura</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0c0e14;
    --bg2: #10131a;
    --gold: #e8c77a;
    --gold-dim: rgba(232,199,122,0.15);
    --white: #eceae5;
    --muted: rgba(236,234,229,0.4);
    --serif: 'Playfair Display', serif;
    --sans: 'DM Sans', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .slide {
    width: 100vw; height: 100vh; height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative; overflow: hidden;
  }

  /* Left panel */
  .left {
    display: flex; flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 7vw, 8rem);
    border-right: 1px solid rgba(232,199,122,0.1);
    position: relative;
    z-index: 2;
  }

  /* Right panel - dark grid texture */
  .right {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: clamp(2rem, 5vw, 6rem);
    background: var(--bg2);
    position: relative; overflow: hidden;
  }

  .right::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(232,199,122,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,199,122,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .right-glow {
    width: clamp(200px, 35vw, 420px);
    height: clamp(200px, 35vw, 420px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,199,122,0.06), transparent 70%);
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
  }

  .stat {
    text-align: center; position: relative; z-index: 2;
    opacity: 0; transform: scale(0.9);
    animation: popIn 0.8s ease forwards 1s;
  }
  .stat-num {
    font-family: var(--serif);
    font-size: clamp(3rem, 7vw, 6.5rem);
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    display: block;
  }
  .stat-label {
    font-family: var(--sans);
    font-size: clamp(0.7rem, 1.2vw, 0.9rem);
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  .eyebrow {
    font-family: var(--sans);
    font-size: clamp(0.6rem, 0.9vw, 0.7rem);
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: clamp(1rem, 2.5vh, 2rem);
    opacity: 0;
    animation: slideRight 0.6s ease forwards 0.2s;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 3.8vw, 3.8rem);
    font-weight: 700;
    line-height: 1.15;
    color: var(--white);
    margin-bottom: clamp(1rem, 2vh, 1.5rem);
    opacity: 0;
    animation: slideRight 0.7s ease forwards 0.4s;
  }

  h1 strong {
    color: var(--gold);
    font-style: italic;
    font-weight: 700;
  }

  .divider {
    width: clamp(2rem, 4vw, 3.5rem);
    height: 1px;
    background: var(--gold);
    margin-bottom: clamp(1rem, 2vh, 1.5rem);
    opacity: 0;
    animation: expandWidth 0.5s ease forwards 0.7s;
    transform-origin: left;
  }

  .sub {
    font-family: var(--sans);
    font-size: clamp(0.8rem, 1.3vw, 1rem);
    font-weight: 300;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: clamp(1.5rem, 3vh, 2.5rem);
    opacity: 0;
    animation: slideRight 0.7s ease forwards 0.85s;
  }

  .cta {
    font-family: var(--sans);
    font-size: clamp(0.7rem, 1.1vw, 0.85rem);
    font-weight: 500;
    color: var(--bg);
    background: var(--gold);
    padding: 0.85em 2em;
    display: inline-block;
    letter-spacing: 0.05em;
    opacity: 0;
    animation: slideRight 0.7s ease forwards 1.05s;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .cta:hover { opacity: 0.85; }

  @keyframes slideRight {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes expandWidth {
    from { opacity: 0; transform: scaleX(0); }
    to   { opacity: 1; transform: scaleX(1); }
  }
</style>
</head>
<body>
<div class="slide">
  <div class="left">
    <p class="eyebrow">TestaferroLegal.com · Solución legal</p>
    <h1>Deje de ser administrador en <strong>7 días.</strong></h1>
    <div class="divider"></div>
    <p class="sub">Compramos su sociedad con deudas. Usted queda desvinculado legalmente. Su casa, sus ahorros y su futuro, protegidos.</p>
    <div class="cta">Descubra cómo funciona</div>
  </div>
  <div class="right">
    <div class="right-glow">
      <div class="stat">
        <span class="stat-num">+2.500</span>
        <span class="stat-label">operaciones · desde 2001</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
